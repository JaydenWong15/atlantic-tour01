<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Atlantic</title>
  <style>
    :root {
      --sea: #0b3c5d;
      --sea-deep: #072a42;
      --wave: #1d7fa6;
      --foam: #eef5f8;
      --card: #ffffff;
      --text: #14232e;
      --muted: #6b7f8c;
      --sand: #e8b04b;
      --sand-dark: #c9922f;
      --bot: #ffffff;
      --user: #1d7fa6;
      --line: #d9e6ec;
      --error: #b42318;
      --error-bg: #fdecea;
      --warn: #b45309;
      --warn-bg: #fff4e0;
      --ok: #1f8a4c;
      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-title: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
      --font-price: "Trebuchet MS", "Avenir Next", "Segoe UI Black", ui-rounded, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --foam: #0a1820;
        --card: #0f222d;
        --text: #e6f0f5;
        --muted: #8aa1ae;
        --bot: #15303e;
        --line: #1e3a49;
        --error-bg: #3a1714;
        --error: #ffb4a8;
        --warn-bg: #3a2a10;
        --warn: #f5b754;
        --ok: #4ade80;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--foam);
      color: var(--text);
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100%;
      max-width: 920px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--card);
    }
    header {
      background: linear-gradient(135deg, var(--sea-deep), var(--sea) 60%, var(--wave));
      color: #fff;
      padding: 18px 16px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: grid; place-items: center; flex-shrink: 0;
    }
    header h1 { font-family: var(--font-title); font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.8rem; opacity: 0.8; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.wide { max-width: 100%; width: 100%; }
    .bubble {
      padding: 11px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 620px;
    }
    .bot .bubble { background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 6px; align-self: flex-start; }
    .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 6px; }
    .error .bubble { background: var(--error-bg); color: var(--error); border-color: transparent; }
    .thinking .bubble { color: var(--muted); font-style: italic; }
    .dots span { display: inline-block; animation: blink 1.4s infinite both; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    .meta { font-size: 0.72rem; color: var(--muted); margin-top: 6px; padding: 0 6px; }

    /* Tour cards, compact: 1 per row on phones, 2 on tablets, 3 on desktop */
    .cards { display: grid; gap: 12px; margin-top: 10px; grid-template-columns: 1fr; }
    @media (min-width: 480px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 760px) { .cards { grid-template-columns: repeat(3, 1fr); } }
    .tour {
      --c: #64748b;
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 3px solid var(--c);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px rgba(7, 42, 66, 0.06);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .tour:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(7, 42, 66, 0.12); }
    .tour.cliff   { --c: #2f855a; }
    .tour.boat    { --c: #1d6fa5; }
    .tour.kayak   { --c: #0f8b8d; }
    .tour.food    { --c: #d9822b; }
    .tour.cycle   { --c: #6b46c1; }
    .tour.outdoor { --c: #c05680; }

    .photo {
      position: relative;
      height: 120px;
      background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 55%, #072a42));
      overflow: hidden;
    }
    .photo img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .photo img.loaded { opacity: 1; }
    .photo::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent 45%, rgba(0,0,0,0.25));
      pointer-events: none;
    }
    .photo .icon {
      position: absolute; right: 10px; bottom: 10px;
      width: 38px; height: 38px; opacity: 0.9;
    }
    .photo.has-img .icon { display: none; }
    .chip {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: var(--c);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .credit {
      position: absolute; right: 6px; bottom: 4px; z-index: 2;
      font-size: 0.58rem;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      display: none;
    }
    .credit:hover { text-decoration: underline; }
    .photo.has-img .credit { display: block; }

    .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .tour h3 {
      font-family: var(--font-title);
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
    }
    .where { font-size: 0.72rem; color: var(--muted); }
    .price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .price {
      font-family: var(--font-price);
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      color: var(--c);
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .price small { font-family: var(--font-ui); font-size: 0.66rem; font-weight: 500; color: var(--muted); }
    .duration { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .slots { font-size: 0.72rem; font-weight: 600; }
    .bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 3px; }
    .bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
    .slots.low { color: var(--warn); }
    .bar.low i { background: var(--warn); }
    .slots.none { color: var(--error); }
    .desc {
      font-size: 0.76rem;
      line-height: 1.45;
      color: var(--text);
      opacity: 0.85;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .desc.open { -webkit-line-clamp: unset; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
    .tag {
      font-size: 0.64rem;
      padding: 2px 6px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--c) 12%, transparent);
      color: var(--c);
      font-weight: 600;
    }
    .tag.offer { background: var(--sand); color: var(--sea-deep); }
    .flag {
      font-size: 0.7rem;
      line-height: 1.35;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 8px;
      padding: 6px 8px;
      font-weight: 600;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--card);
    }
    #input {
      flex: 1; min-width: 0;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--foam);
      color: var(--text);
      font: inherit; font-size: 1rem;
      outline: none;
    }
    #input:focus { border-color: var(--wave); }
    #send {
      padding: 0 20px; border: none; border-radius: 999px;
      background: var(--sand); color: var(--sea-deep);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    #send:hover { background: var(--sand-dark); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
          <path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
          <path d="M2 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
        </svg>
      </div>
      <div>
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours, west of Ireland</p>
      </div>
    </header>

    <div id="chat" aria-live="polite"></div>

    <form id="form">
      <input id="input" type="text" placeholder="Ask about tours, prices, slots..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
    const BRAIN_URL = "https://luas-class.kluxy.app/chat";
    const SYSTEM = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    /* ---------- Category styling and fallback icons ---------- */
    const CATEGORY = {
      "cliff walk":       { cls: "cliff",   icon: '<path d="M3 21 9 9l4 6 3-4 5 10Z"/><path d="M14 5q1.5-1.5 3 0 1.5-1.5 3 0"/>' },
      "boat tour":        { cls: "boat",    icon: '<path d="M12 3v12"/><path d="M12 4l6 9h-6"/><path d="M3 15h18l-3 4H6Z"/><path d="M2 22q2.5-1.5 5 0t5 0 5 0 5 0"/>' },
      "kayak trip":       { cls: "kayak",   icon: '<path d="M2 15q10 4 20 0-10-3-20 0Z"/><path d="M5 6l14 14"/><circle cx="12" cy="10" r="1.8"/>' },
      "food tour":        { cls: "food",    icon: '<path d="M7 3v7a2 2 0 0 0 4 0V3"/><path d="M9 10v11"/><path d="M17 3c-2.5 2-2.5 7 0 8v10"/>' },
      "cycling":          { cls: "cycle",   icon: '<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h6l2 7"/><path d="M10 9l3 7H6"/><path d="M14 6h3"/>' },
      "outdoor activity": { cls: "outdoor", icon: '<circle cx="16" cy="7" r="2.5"/><path d="M16 2v1M21 7h-1M19.5 3.5l-.7.7"/><path d="M2 21l6-8 4 4 3-4 7 8Z"/>' }
    };

    /* ---------- Real photos ----------
       Each tour maps to Wikipedia articles about the place. The page asks Wikipedia
       for that article's lead photo (from Wikimedia Commons) and tries the next
       title if one has no photo. New tours fall back to their town name. */
    const PHOTO_TITLES = {
      ACT001: ["Cliffs of Moher"],
      ACT002: ["Inishmore", "Dún Aonghasa"],
      ACT003: ["Diamond Hill (Connemara)", "Connemara National Park"],
      ACT004: ["Killary Harbour"],
      ACT005: ["Spanish Arch", "Galway"],
      ACT006: ["Sky Road", "Clifden"],
      ACT007: ["Achill Island"],
      ACT008: ["Dog's Bay", "Gurteen Bay", "Roundstone", "Connemara"],
      ACT009: ["Croagh Patrick"],
      ACT010: ["Inishbofin, County Galway"],
      ACT011: ["The Burren"],
      ACT012: ["Kilkee"],
      ACT013: ["Great Western Greenway", "Westport, County Mayo"],
      ACT014: ["Loop Head Lighthouse", "Loop Head"],
      ACT015: ["Kilkieran Bay", "Kilkieran", "Connemara"],
      ACT016: ["Doolough", "Delphi, County Mayo"],
      ACT017: ["Inisheer", "Dún Aonghasa", "Inishmore"],
      ACT018: ["Salthill"],
      ACT019: ["Mweelrea"],
      ACT020: ["Dunguaire Castle", "Kinvara"],
      ACT021: ["Cliffs of Moher", "The Burren"],
      ACT022: ["Renvyle", "Twelve Bens"],
      ACT023: ["Clare Island"],
      ACT024: ["Galway Bay"],
      ACT025: ["Fanore", "The Burren"],
      ACT026: ["Twelve Bens"],
      ACT027: ["Ballycroy National Park"],
      ACT028: ["Inishmaan", "Inisheer"],
      ACT029: ["Spiddal", "Galway Bay"],
      ACT030: ["Keem Bay", "Achill Island"]
    };
    const photoCache = new Map();

    async function wikiPhoto(title) {
      if (photoCache.has(title)) return photoCache.get(title);
      const p = (async () => {
        try {
          const res = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g, "_")));
          if (!res.ok) return null;
          const d = await res.json();
          if (d.type === "disambiguation" || !d.thumbnail || !d.thumbnail.source) return null;
          // Skip maps, diagrams and signposts, keep real landscape photos
          if (/\.svg|map|locator|location|sign|flag|coat_of_arms|logo/i.test(d.thumbnail.source)) return null;
          // Ask for a sharper version than the default small thumbnail
          const src = d.thumbnail.source.replace(/\/\d+px-/, "/640px-");
          return { src, fallback: d.thumbnail.source, page: d.content_urls?.desktop?.page || "", title: d.title };
        } catch (_) { return null; }
      })();
      photoCache.set(title, p);
      return p;
    }

    async function loadPhoto(el, tour) {
      const town = (tour.location || "").split(",")[0].trim();
      const titles = [...(PHOTO_TITLES[tour.tour_id] || []), town].filter(Boolean);
      for (const t of titles) {
        const photo = await wikiPhoto(t);
        if (!photo) continue;
        const img = el.querySelector("img");
        const credit = el.querySelector(".credit");
        img.onerror = () => {
          if (img.src !== photo.fallback) img.src = photo.fallback;
        };
        img.onload = () => { img.classList.add("loaded"); el.classList.add("has-img"); };
        img.alt = tour.tour_name + ", photo of " + photo.title;
        img.src = photo.src;
        credit.href = photo.page;
        credit.title = "Photo: " + photo.title + ", Wikimedia Commons";
        return;
      }
    }

    /* ---------- Helpers ---------- */
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function timeNow() {
      return new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }
    const euro = n => new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);

    // CSV parser that handles quotes, commas and line breaks inside quotes
    function parseCSV(text) {
      const rows = []; let row = [], field = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (q) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') q = false;
          else field += ch;
        } else if (ch === '"') q = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += ch;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      const head = rows.shift().map(h => h.trim());
      return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
    }

    function median(nums) {
      const s = nums.filter(n => !isNaN(n)).sort((a, b) => a - b);
      if (!s.length) return 0;
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    /* ---------- Rendering ---------- */
    function addMessage(text, who, opts = {}) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + who + (opts.extra ? " " + opts.extra : "");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (opts.html) bubble.innerHTML = opts.html; else bubble.textContent = text;
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    function tourCard(t, med, aiNote) {
      const cat = CATEGORY[(t.category || "").toLowerCase()] || { cls: "", icon: '<circle cx="12" cy="12" r="8"/>' };
      const price = parseFloat(t.price_eur);
      const slots = parseInt(t.slots_this_week, 10);
      const cap = parseInt(t.capacity, 10);
      const hasNote = /note to ai/i.test(t.description);
      const desc = t.description.replace(/\s*Note to AI:[\s\S]*$/i, "");

      const reasons = [];
      if (isNaN(price)) reasons.push("Price is missing.");
      else if (med && (price > med * 5 || price < med * 0.3)) reasons.push("This price looks unusual.");
      if (hasNote) reasons.push("The listing has an odd note in it.");
      if (aiNote && /implausib|unusual|check with staff|confirm/i.test(aiNote) && !reasons.length) reasons.push("Our assistant flagged this one.");
      const flag = reasons.length
        ? `<div class="flag">⚠ ${esc([...new Set(reasons)].join(" "))} Please check with staff before booking.</div>` : "";

      let slotsCls = "", slotsTxt;
      if (isNaN(slots)) slotsTxt = "Slots not listed";
      else if (slots === 0) { slotsCls = "none"; slotsTxt = "Sold out this week"; }
      else { slotsCls = slots <= 3 ? "low" : ""; slotsTxt = `${slots} slot${slots === 1 ? "" : "s"} left this week`; }
      const pct = !isNaN(slots) && cap ? Math.min(100, Math.round((slots / cap) * 100)) : 0;

      return `
        <article class="tour ${cat.cls}" data-id="${esc(t.tour_id)}">
          <div class="photo">
            <img alt="" loading="lazy" referrerpolicy="no-referrer">
            <span class="chip">${esc(t.category)}</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${cat.icon}</svg>
            <a class="credit" target="_blank" rel="noopener">📷 Wikimedia</a>
          </div>
          <div class="body">
            <h3>${esc(t.tour_name)}</h3>
            <div class="where">📍 ${esc(t.location)} · ${esc(t.meeting_point)}</div>
            <div class="price-row">
              <div class="price">${isNaN(price) ? "N/A" : esc(euro(price))} <small>pp</small></div>
              <div class="duration">⏱ ${esc(t.duration_hours)}h</div>
            </div>
            <div>
              <div class="slots ${slotsCls}">${esc(slotsTxt)}</div>
              <div class="bar ${slotsCls}"><i style="width:${pct}%"></i></div>
            </div>
            <p class="desc" title="Tap to read more">${esc(desc)}</p>
            <div class="tags">
              <span class="tag">📅 ${esc(t.availability)}</span>
              <span class="tag">👥 ${esc(t.capacity)}</span>
              ${t.special_offer ? `<span class="tag offer">🎁 ${esc(t.special_offer)}</span>` : ""}
            </div>
            ${flag}
          </div>
        </article>`;
    }

    function renderAnswer(reply, tours, fetchedAt) {
      const lower = reply.toLowerCase();
      const med = median(tours.map(t => parseFloat(t.price_eur)));

      // Tours the assistant mentioned, in the order it mentioned them
      const found = tours
        .map(t => {
          const idPos = t.tour_id ? lower.indexOf(t.tour_id.toLowerCase()) : -1;
          const namePos = t.tour_name ? lower.indexOf(t.tour_name.toLowerCase()) : -1;
          const pos = [idPos, namePos].filter(p => p >= 0);
          return { t, pos: pos.length ? Math.min(...pos) : -1 };
        })
        .filter(x => x.pos >= 0)
        .sort((a, b) => a.pos - b.pos)
        .map(x => x.t);

      // Split the reply into intro text and per-tour comments
      const notes = {};
      const keep = [];
      reply.split("\n").forEach(line => {
        const l = line.toLowerCase();
        const hit = found.find(t => l.includes(t.tour_id.toLowerCase()) || l.includes(t.tour_name.toLowerCase()));
        if (hit) notes[hit.tour_id] = line.replace(/^\s*[-*•\d.]+\s*/, "").trim();
        else keep.push(line);
      });
      const intro = found.length ? keep.join("\n").replace(/\n{2,}/g, "\n").trim() : reply;

      const wrap = document.createElement("div");
      wrap.className = "msg bot" + (found.length ? " wide" : "");
      if (intro) {
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = intro;
        wrap.appendChild(b);
      }
      if (found.length) {
        const grid = document.createElement("div");
        grid.className = "cards";
        grid.innerHTML = found.map(t => tourCard(t, med, notes[t.tour_id])).join("");
        wrap.appendChild(grid);
        grid.querySelectorAll(".tour").forEach((card, i) => loadPhoto(card.querySelector(".photo"), found[i]));
        grid.querySelectorAll(".desc").forEach(d => d.addEventListener("click", () => d.classList.toggle("open")));
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "Data fetched live at " + fetchedAt;
      wrap.appendChild(meta);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    /* ---------- Data flow ---------- */
    const history = []; // past user questions and assistant replies

    async function ask(question) {
      const csvRes = await fetch(CSV_URL, { cache: "no-store" });
      if (!csvRes.ok) throw new Error("Could not load the tour catalogue (HTTP " + csvRes.status + ").");
      const csv = await csvRes.text();
      const fetchedAt = timeNow();

      // Earlier turns go first so the assistant remembers the conversation.
      // Only the newest message carries the live CSV, which keeps requests small.
      const latest = { role: "user", content: "Live data (CSV):\n" + csv + "\n\nCustomer question: " + question };
      const post = msgs => fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system: SYSTEM, messages: msgs })
      });
      let res = await post([...history, latest]);
      // If the server rejects the longer conversation, fall back to the single question
      if (!res.ok && history.length) res = await post([latest]);
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error("The assistant returned an error (HTTP " + res.status + ")" + (body ? ". " + body.slice(0, 200) : "."));
      }
      const data = await res.json();
      if (!data || typeof data.reply !== "string") throw new Error("The assistant sent back a response without a reply.");

      let tours = [];
      try { tours = parseCSV(csv); } catch (_) { tours = []; }
      // Remember this turn (without the CSV), keeping the last 6 exchanges
      history.push({ role: "user", content: question }, { role: "assistant", content: data.reply });
      while (history.length > 12) history.splice(0, 2);

      return { reply: data.reply, tours, fetchedAt };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      send.disabled = true;
      input.disabled = true;

      const thinking = addMessage("", "bot", {
        extra: "thinking",
        html: 'Thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>'
      });

      try {
        const { reply, tours, fetchedAt } = await ask(question);
        thinking.remove();
        renderAnswer(reply, tours, fetchedAt);
      } catch (err) {
        thinking.remove();
        addMessage("Sorry, something went wrong. " + (err && err.message ? err.message : String(err)), "bot", { extra: "error" });
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    addMessage("Hi, I'm Ask Atlantic. Ask me about our tours, prices or how many slots are left this week.", "bot");
    input.focus();
  </script>
</body>
</html>
